<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neraca Saldo - FahnSmart Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent mb-3"></div>
        <p class="text-xs font-semibold text-slate-600 tracking-wider uppercase animate-pulse">Memuat Neraca Saldo...</p>
    </div>

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <a href="bukubesar.html" class="text-xs font-medium text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Kembali ke Buku Besar
                </a>
                <h1 class="text-sm md:text-lg font-bold tracking-tight text-slate-900 flex items-center gap-2">
                    <i data-lucide="scale" class="w-5 h-5 text-indigo-600"></i> Neraca Saldo 
                    <span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-normal">Trial Balance</span>
                </h1>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="penyesuaian.html" class="text-xs font-medium text-indigo-700 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 border border-indigo-200 shadow-sm">
                    <i data-lucide="sliders" class="w-3.5 h-3.5"></i> Lanjut ke Penyesuaian
                </a>
                <div class="text-xs text-slate-500 font-medium hidden sm:block" id="current-date"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl w-full mx-auto px-4 py-8 flex-grow space-y-6">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="table" class="w-4 h-4 text-indigo-600"></i> Ringkasan Saldo Akun
                </h2>
                <span id="balance-status" class="text-xs font-bold px-3 py-1 rounded-xl bg-slate-100 text-slate-700">Memeriksa Keseimbangan...</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-200 text-xs text-slate-500 uppercase">
                            <th class="py-2.5 px-3">No. Akun</th>
                            <th class="py-2.5 px-3">Nama Akun</th>
                            <th class="py-2.5 px-3 text-right">Debit (Rp)</th>
                            <th class="py-2.5 px-3 text-right">Kredit (Rp)</th>
                        </tr>
                    </thead>
                    <tbody id="trial-balance-body" class="divide-y divide-slate-100">
                        <!-- Data dimasukkan via JS -->
                    </tbody>
                    <tfoot>
                        <tr class="bg-slate-50 font-bold border-t-2 border-slate-200 text-slate-900">
                            <td colspan="2" class="py-3 px-3 text-right uppercase text-xs">Total Sisi:</td>
                            <td id="total-debit" class="py-3 px-3 text-right text-indigo-700">Rp 0</td>
                            <td id="total-credit" class="py-3 px-3 text-right text-rose-700">Rp 0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white">
        &copy; 2026 FahnSmart Finance &bull; Neraca Saldo
    </footer>

    <!-- JavaScript Neraca Saldo -->
    <script>
        lucide.createIcons();
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', { dateStyle: 'full' });

        const chartOfAccounts = [
            { id: '101', name: 'Kas di Laci', type: 'Aset', normal: 'Debit' },
            { id: '102', name: 'Piutang Usaha (Kasbon)', type: 'Aset', normal: 'Debit' },
            { id: '103', name: 'Persediaan Barang', type: 'Aset', normal: 'Debit' },
            { id: '104', name: 'Peralatan / Inventaris Toko', type: 'Aset', normal: 'Debit' },
            { id: '201', name: 'Utang Usaha', type: 'Liabilitas', normal: 'Kredit' },
            { id: '301', name: 'Modal', type: 'Ekuitas', normal: 'Kredit' },
            { id: '401', name: 'Pendapatan Penjualan', type: 'Pendapatan', normal: 'Kredit' },
            { id: '501', name: 'Beban Operasional / Belanja', type: 'Beban', normal: 'Debit' }
        ];

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        function generateTrialBalance() {
            let journals = JSON.parse(localStorage.getItem('databaseFahnSmartFinanceV1')) || [];
            let adjustments = JSON.parse(localStorage.getItem('databaseFahnSmartAdjustmentsV1')) || [];
            const allTransactions = [...journals, ...adjustments];

            let accountTotals = {};
            chartOfAccounts.forEach(acc => {
                accountTotals[acc.id] = { debit: 0, credit: 0 };
            });

            allTransactions.forEach(trx => {
                trx.debits.forEach(d => {
                    if (accountTotals[d.accountId]) accountTotals[d.accountId].debit += d.amount;
                });
                trx.credits.forEach(c => {
                    if (accountTotals[c.accountId]) accountTotals[c.accountId].credit += c.amount;
                });
            });

            const tbody = document.getElementById('trial-balance-body');
            tbody.innerHTML = '';

            let grandTotalDebit = 0;
            let grandTotalCredit = 0;

            chartOfAccounts.forEach(acc => {
                let t = accountTotals[acc.id];
                let netBalance = 0;
                let debitDisplay = 0;
                let creditDisplay = 0;

                if (acc.normal === 'Debit') {
                    netBalance = t.debit - t.credit;
                    if (netBalance >= 0) {
                        debitDisplay = netBalance;
                    } else {
                        creditDisplay = Math.abs(netBalance);
                    }
                } else {
                    netBalance = t.credit - t.debit;
                    if (netBalance >= 0) {
                        creditDisplay = netBalance;
                    } else {
                        debitDisplay = Math.abs(netBalance);
                    }
                }

                grandTotalDebit += debitDisplay;
                grandTotalCredit += creditDisplay;

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-all">
                        <td class="py-2.5 px-3 text-xs font-mono font-medium text-slate-600">${acc.id}</td>
                        <td class="py-2.5 px-3 text-xs font-medium text-slate-900">${acc.name}</td>
                        <td class="py-2.5 px-3 text-xs text-right text-indigo-700 font-semibold">${debitDisplay > 0 ? formatRupiah(debitDisplay) : '-'}</td>
                        <td class="py-2.5 px-3 text-xs text-right text-rose-700 font-semibold">${creditDisplay > 0 ? formatRupiah(creditDisplay) : '-'}</td>
                    </tr>
                `;
            });

            document.getElementById('total-debit').innerText = formatRupiah(grandTotalDebit);
            document.getElementById('total-credit').innerText = formatRupiah(grandTotalCredit);

            const statusBadge = document.getElementById('balance-status');
            if (grandTotalDebit === grandTotalCredit && grandTotalDebit > 0) {
                statusBadge.className = "text-xs font-bold px-3 py-1 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200";
                statusBadge.innerText = "SEIMBANG (BALANCE)";
            } else if (grandTotalDebit === 0 && grandTotalCredit === 0) {
                statusBadge.className = "text-xs font-bold px-3 py-1 rounded-xl bg-slate-100 text-slate-700";
                statusBadge.innerText = "BELUM ADA TRANSAKSI";
            } else {
                statusBadge.className = "text-xs font-bold px-3 py-1 rounded-xl bg-rose-50 text-rose-700 border border-rose-200";
                statusBadge.innerText = "TIDAK SEIMBANG (UNBALANCED)";
            }
        }

        window.addEventListener('load', function() {
            generateTrialBalance();
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 300);
                }
            }, 300);
        });
    </script>
</body>
</html>
