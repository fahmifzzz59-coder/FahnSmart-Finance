<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal Keuangan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-6 text-slate-800">

    <div class="max-w-md w-full">
        <div class="mb-8 text-center">
            <div class="text-3xl mb-2">🔐</div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Masuk ke Sistem Single-Entry</h1>
            <p class="text-sm text-slate-500 mt-1">Silakan masukkan akun Anda untuk melanjutkan.</p>
        </div>

        <div id="error-msg" class="hidden mb-4 p-3 rounded-xl bg-red-50 border border-red-200 text-red-600 text-xs text-center">
            Username atau password salah! Silakan coba lagi.
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Username / Peran</label>
                <input type="text" id="username" required placeholder="Ketik 'admin' atau 'user'" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-slate-900 focus:outline-none transition-all text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-slate-900 focus:outline-none transition-all text-sm">
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl transition-all text-sm shadow-sm">
                Masuk 🚀
            </button>
        </form>

        <div class="mt-6 p-4 rounded-xl bg-slate-50 border border-slate-100 text-xs text-slate-500 space-y-1">
            <p class="font-semibold text-slate-700">💡 Panduan Login:</p>
            <p>• Masuk sebagai Admin: Username: <code class="bg-white px-1.5 py-0.5 rounded border">admin</code></p>
            <p>• Masuk sebagai User: Username: <code class="bg-white px-1.5 py-0.5 rounded border">user</code> | Pass: <code class="bg-white px-1.5 py-0.5 rounded border">user</code></p>
        </div>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-slate-500 hover:text-slate-900 transition-colors">← Kembali ke Pilihan Menu Utama</a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            const user = document.getElementById('username').value.trim().toLowerCase();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');

            // Logika pengarahan halaman sesuai permintaan
            if (user === 'admin') {
                // Jika mengetik admin, masuk ke admin.html
                window.location.href = 'admin.html';
            } else if (user === 'user' && pass === 'user') {
                // Jika mengetik user & pass user, masuk ke user.html
                window.location.href = 'user.html';
            } else {
                // Jika salah, tampilkan peringatan
                errorMsg.classList.remove('hidden');
            }
        }
    </script>

</body>
</html>
