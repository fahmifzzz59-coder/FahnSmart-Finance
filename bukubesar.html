<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Besar - FahnSmart Finance</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Loading Screen Overlay -->
    <div id="loading-screen" class="fixed inset-0 bg-white/90 backdrop-blur-sm z-50 flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent mb-3"></div>
        <p class="text-xs font-semibold text-slate-600 tracking-wider uppercase animate-pulse">Memuat Buku Besar...</p>
    </div>

    <!-- Navbar / Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <a href="jurnal.html" class="text-xs font-medium text-slate-500 hover:text-slate-800 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5">
                    <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Kembali ke Jurnal Umum
                </a>
                <h1 class="text-sm md:text-lg font-bold tracking-tight text-slate-900 flex items-center gap-2">
                    <i data-lucide="book-open" class="w-5 h-5 text-indigo-600"></i> Buku Besar 
                    <span class="text-[10px] bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-normal">General Ledger</span>
                </h1>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="neraca.html" class="text-xs font-medium text-indigo-700 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 border border-indigo-200 shadow-sm">
                    <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Lanjut ke Neraca Saldo
                </a>
                <div class="text-xs text-slate-500 font-medium hidden sm:block" id="current-date"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl w-full mx-auto px-4 py-8 flex-grow space-y-6">
        
        <!-- Filter Akun -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-base font-bold text-slate-900">Pilih Akun Buku Besar</h2>
                <p class="text-xs text-slate-500">Lihat mutasi transaksi dan saldo akhir per akun secara terperinci.</p>
            </div>
            <div class="w-full sm:w-auto">
                <select id="account-filter" onchange="renderGeneralLedger()" class="w-full sm:w-72 text-sm border border-slate-200 rounded-xl px-3 py-2 bg-slate-50 focus:outline-none focus:border-indigo-500">
                    <!-- Options diisi via JS -->
                </select>
            </div>
        </div>

        <!-- Kontainer Tabel Buku Besar -->
        <div class="space-y-6" id="ledger-container">
            <!-- Render tabel per akun atau akun terpilih akan muncul di sini -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200 bg-white">
        &copy; 2026 FahnSmart Finance &bull; Buku Besar
    </footer>

    <!-- JavaScript Buku Besar -->
    <script>
        lucide.createIcons();
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('id-ID', { dateStyle: 'full' });

        const chartOfAccounts = [
            { id: '101', name: 'Kas di Laci', type: 'Aset', normal: 'Debit' },
            { id: '102', name: 'Piutang Usaha (Kasbon)', type: 'Aset', normal: 'Debit' },
            { id: '103', name: 'Persediaan Barang', type: 'Aset', normal: 'Debit' },
            { id: '104', name: 'Peralatan / Inventaris Toko', type: 'Aset', normal: 'Debit' },
            { id: '201', name: 'Utang Usaha', type: 'Liabilitas', normal: 'Kredit' },
            { id: '301', name: 'Modal', type: 'Ekuitas', normal: 'Kredit' },
            { id: '401', name: 'Pendapatan Penjualan', type: 'Pendapatan', normal: 'Kredit' },
            { id: '501', name: 'Beban Operasional / Belanja', type: 'Beban', normal: 'Debit' }
        ];

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        function initAccountFilter() {
            const select = document.getElementById('account-filter');
            select.innerHTML = '<option value="ALL">-- Tampilkan Semua Akun --</option>';
            chartOfAccounts.forEach(acc => {
                select.innerHTML += `<option value="${acc.id}">${acc.id} - ${acc.name}</option>`;
            });
        }

        function renderGeneralLedger() {
            // Ambil data transaksi dari Jurnal Umum & Jurnal Penyesuaian agar sinkron
            let journals = JSON.parse(localStorage.getItem('databaseFahnSmartFinanceV1')) || [];
            let adjustments = JSON.parse(localStorage.getItem('databaseFahnSmartAdjustmentsV1')) || [];
            const allTransactions = [...journals, ...adjustments];

            // Urutkan transaksi berdasarkan tanggal
            allTransactions.sort((a, b) => new Date(a.date) - new Date(b.date));

            const selectedFilter = document.getElementById('account-filter').value;
            const container = document.getElementById('ledger-container');
            container.innerHTML = '';

            let accountsToProcess = selectedFilter === 'ALL' 
                ? chartOfAccounts 
                : chartOfAccounts.filter(acc => acc.id === selectedFilter);

            accountsToProcess.forEach(acc => {
                let rows = [];
                let runningBalance = 0;

                allTransactions.forEach(trx => {
                    // Cek di sisi debit
                    trx.debits.forEach(d => {
                        if (d.accountId === acc.id) {
                            if (acc.normal === 'Debit') {
                                runningBalance += d.amount;
                            } else {
                                runningBalance -= d.amount;
                            }
                            rows.push({
                                date: trx.date,
                                ref: trx.refNo || '-',
                                desc: trx.desc,
                                debit: d.amount,
                                credit: 0,
                                balance: runningBalance
                            });
                        }
                    });

                    // Cek di sisi kredit
                    trx.credits.forEach(c => {
                        if (c.accountId === acc.id) {
                            if (acc.normal === 'Kredit') {
                                runningBalance += c.amount;
                            } else {
                                runningBalance -= c.amount;
                            }
                            rows.push({
                                date: trx.date,
                                ref: trx.refNo || '-',
                                desc: trx.desc,
                                debit: 0,
                                credit: c.amount,
                                balance: runningBalance
                            });
                        }
                    });
                });

                let tbodyHtml = '';
                if (rows.length === 0) {
                    tbodyHtml = `<tr><td colspan="6" class="text-center py-4 text-slate-400 text-xs italic">Belum ada transaksi pada akun ini.</td></tr>`;
                } else {
                    rows.forEach(r => {
                        tbodyHtml += `
                            <tr class="hover:bg-slate-50/80 transition-all border-b border-slate-100">
                                <td class="py-2.5 px-3 text-xs text-slate-600">${r.date}</td>
                                <td class="py-2.5 px-3 text-xs">
                                    <span class="bg-slate-100 text-slate-700 px-1.5 py-0.5 rounded font-mono text-[10px] border border-slate-200">${r.ref}</span>
                                </td>
                                <td class="py-2.5 px-3 text-xs font-medium text-slate-800">${r.desc}</td>
                                <td class="py-2.5 px-3 text-xs text-right text-indigo-700 font-semibold">${r.debit > 0 ? formatRupiah(r.debit) : '-'}</td>
                                <td class="py-2.5 px-3 text-xs text-right text-rose-700 font-semibold">${r.credit > 0 ? formatRupiah(r.credit) : '-'}</td>
                                <td class="py-2.5 px-3 text-xs text-right font-bold text-slate-900">${formatRupiah(r.balance)}</td>
                            </tr>
                        `;
                    });
                }

                container.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                            <h3 class="text-sm font-bold text-slate-900 flex items-center gap-2">
                                <span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md font-mono text-xs border border-indigo-200">${acc.id}</span>
                                ${acc.name} 
                                <span class="text-[10px] text-slate-400 font-normal">(${acc.type} &bull; Saldo Normal: ${acc.normal})</span>
                            </h3>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="border-b border-slate-200 text-xs text-slate-500 uppercase">
                                        <th class="py-2 px-3">Tanggal</th>
                                        <th class="py-2 px-3">Ref</th>
                                        <th class="py-2 px-3">Keterangan</th>
                                        <th class="py-2.5 px-3 text-right">Debit (Rp)</th>
                                        <th class="py-2.5 px-3 text-right">Kredit (Rp)</th>
                                        <th class="py-2.5 px-3 text-right">Saldo (Rp)</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${tbodyHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });
        }

        // Inisialisasi & Tutup Loading Screen
        window.addEventListener('load', function() {
            initAccountFilter();
            renderGeneralLedger();
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 300);
                }
            }, 300);
        });
    </script>
</body>
</html>
